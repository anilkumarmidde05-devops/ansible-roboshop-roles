plugin: amazon.aws.aws_ec2
regions:
  - us-east-1
hostnames:
  #- ip-address
  - private-ip-address
filters:
  instance-state-name: running
  tag:Name:
    - frontend-dev

compose: #this sets the ansible_host variable to connect with the private ip address without changing the host name
  ansible_host: private-ip-address
  ansible_connection: local
keyed_groups:
  - separator: ""
    key: tags.Component

vars: # you can access below anywhere
  ansible_user=ec2-user
  ansible_password=DevOps321
