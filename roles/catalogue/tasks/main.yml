- name: app_setup
  ansible.builtin.import_role:
    name: common
    tasks_from: app_setup.yml

- name: nodejs_setup
  ansible.builtin.import_role:
    name: common
    tasks_from: nodejs_setup.yml

- name: systemd_setup
  ansible.builtin.import_role:
    name: common
    tasks_from: systemd_setup.yml

- name: copy mongo repo
  ansible.builtin.copy:
    src: mongo.repo
    dest: /etc/yum.repos.d/mongo.repo

- name: install mongdb client
  ansible.builtin.dnf:
    name: mongodb-mongosh
    state: present
- name: check products loaded
  ansible.builtin.command: mongosh --host "{{MONGODB_HOST}}" --quiet  --eval 'db.getMongo().getDBNames().indexOf("catalogue")' # it will give positive number if the index is available
  register: catalogue_output

- name: load the products
  ansible.builtin.shell: mongosh --host "{{MONGODB_HOST}}" </app/db/master-data.js
  when: catalogue_output.stdout | int < 0 # if it is less than zero then we are loading the products

- name: start catalogue
  ansible.builtin.service:
    name: catalogue
    state: restarted #this is the safest option
    enabled: yes
