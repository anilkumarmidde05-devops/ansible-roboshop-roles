- name: app_setup
  ansible.builtin.import_role:
    name: common
    tasks_from: app_setup.yml

- name: nodejs_setup
  ansible.builtin.import_role:
    name: common
    tasks_from: nodejs_setup.yml

- name: systemd_setup
  ansible.builtin.import_role:
    name: common
    tasks_from: systemd_setup.yml

- name: start cart
  ansible.builtin.service:
    name: cart
    state: restarted #this is the safest option
    enabled: yes
